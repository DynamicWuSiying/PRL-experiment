<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Volatility Task - Oval Version</title>

    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-audio-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>

    <style>
        /* 1. 全屏强制垂直居中，不显示任何滚动条 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #808080;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden !important;
        }

        /* 强制 jsPsych 的所有容器完全填充并居中 */
        #jspsych-target,
        .jspsych-display-element,
        .jspsych-content-wrapper,
        .jspsych-content {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden !important;
        }

        /* 椭圆遮罩容器 */
        .oval-container {
            width: 200px;
            height: 270px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 50%;
            background-color: #808080;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
        }

        /* 人脸：大幅放大裁剪，只保留脸部，尽量去掉肩膀和身体 */
        .stimulus-face {
            height: 230%;
            width: auto;
            object-fit: cover;
            object-position: center 35%;
        }

        /* 房屋 */
        .stimulus-house {
            height: 110%;
            width: auto;
            object-fit: contain;
        }

        .jspsych-btn {
            margin-top: 20px;
            padding: 10px 20px;
        }

        .fixation {
            font-size: 48px;
            line-height: 1;
            text-align: center;
            color: white;
        }

        .digit {
            font-size: 72px;
            line-height: 1;
            text-align: center;
            color: white;
        }

        .feedback {
            font-size: 48px;
            line-height: 1;
            text-align: center;
            color: white;
        }

        .correct {
            color: #7cfc00;
        }

        .wrong {
            color: #ff6b6b;
        }

        .exp-panel {
            max-width: 720px;
            margin: 0 auto;
            text-align: center;
            line-height: 2;
            color: white;
        }

        .exp-panel ul {
            display: inline-block;
            text-align: left;
        }

        .continue-text {
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
    <script src="experiment.js"></script>
</body>
</html>
